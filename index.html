<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Choose text or video and meet someone new on After Dark.">
  <title>After Dark — Meet someone new</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:#05070d;color:#f3f5fb;background-image:radial-gradient(ellipse at 50% 8%,rgba(37,99,235,.16),transparent 48%)}
    .topbar{max-width:1180px;margin:0 auto;padding:20px 28px;background:transparent;border-bottom:1px solid rgba(83,112,163,.16)}
    .topbar .brand{font-size:21px}.age-badge{margin-left:auto}
    .choice-wrap{min-height:calc(100vh - 78px);width:min(100% - 32px,760px);margin:0 auto;display:grid;place-items:center;padding:48px 0 70px}
    .choice-card{width:100%;padding:clamp(28px,6vw,58px);border:1px solid #202a42;border-radius:22px;background:linear-gradient(155deg,rgba(13,16,26,.98),rgba(8,10,17,.98));box-shadow:0 24px 80px rgba(0,0,0,.4);text-align:center}
    .choice-eyebrow{margin:0 0 15px;color:#8bb7ff;font-size:10px;font-weight:700;letter-spacing:.2em}
    .choice-card h1{margin:0;color:#f6f7fb;font:800 clamp(32px,6vw,48px)/1.1 Manrope,sans-serif;letter-spacing:-2px}
    .choice-copy{max-width:440px;margin:15px auto 32px;color:#9eabc2;font-size:14px;line-height:1.7}
    .choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:500px;margin:0 auto}
    .choice-button{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;border:1px solid #315a9d;border-radius:14px;background:#0b1220;color:#b9d4ff;text-decoration:none;font:750 19px Manrope,sans-serif;transition:transform .18s,border-color .18s,background .18s,opacity .18s}
    .choice-button .choice-icon{font-size:23px}.choice-button.video{background:linear-gradient(135deg,#1d4ed8,#3479ed);border-color:#3b82f6;color:#fff;box-shadow:0 10px 28px rgba(37,99,235,.2)}
    .choice-button:not([aria-disabled="true"]):hover{transform:translateY(-2px);border-color:#70a6ff}
    .choice-button[aria-disabled="true"]{opacity:.38;pointer-events:none;filter:saturate(.45)}
    .choice-age{display:flex;align-items:center;justify-content:center;gap:11px;width:max-content;max-width:100%;margin:27px auto 0;padding:12px 17px;border:1px solid #263858;border-radius:12px;background:#0d1422;color:#e3ebfa;text-align:left;cursor:pointer}
    .choice-age input{width:19px;height:19px;accent-color:#3479ed;flex:0 0 auto}.choice-age strong{display:block;font-size:12px}.choice-age small{display:block;margin-top:4px;color:#8e9eb8;font-size:10px}
    .choice-foot{margin:24px 0 0;color:#71829e;font-size:10px;line-height:1.6}
    @media(max-width:540px){.topbar{padding:16px 18px}.choice-wrap{width:min(100% - 22px,480px);padding:28px 0 45px}.choice-card{padding:30px 19px;border-radius:18px}.choice-copy{font-size:13px;margin-bottom:25px}.choice-actions{gap:9px}.choice-button{min-height:65px;font-size:16px;gap:7px}.choice-button .choice-icon{font-size:19px}.choice-age{align-items:flex-start;padding:11px 12px}.choice-age strong{font-size:11px}}
    @media(max-width:360px){.choice-actions{grid-template-columns:1fr}.choice-button{min-height:55px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="After Dark home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M20.7 5.4a11.2 11.2 0 1 0 5.9 19.9A12.5 12.5 0 0 1 20.7 5.4Z"/><path class="brand-star" d="m24.7 4.1.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9Z"/></svg></span><span>After Dark</span></a>
    <span class="age-badge" aria-label="Adults 18 and over only">18+ ADULTS ONLY</span>
  </header>
  <main class="choice-wrap">
    <section class="choice-card" aria-labelledby="choice-title">
      <p class="choice-eyebrow">AFTER DARK · MEET SOMEONE NEW</p>
      <h1 id="choice-title">How would you like to connect?</h1>
      <p class="choice-copy">Choose how you want to meet someone. We'll take you straight to your chat.</p>
      <div class="choice-actions" aria-label="Choose your chat type">
        <a class="choice-button" id="text-choice" href="text.html" aria-disabled="true"><span class="choice-icon" aria-hidden="true">💬</span>Text</a>
        <a class="choice-button video" id="video-choice" href="live.html" aria-disabled="true"><span class="choice-icon" aria-hidden="true">🎥</span>Video</a>
      </div>
      <label class="choice-age" for="age-confirm">
        <input id="age-confirm" type="checkbox">
        <span><strong>I confirm that I am 18 or older</strong><small>By continuing, you agree to use After Dark responsibly.</small></span>
      </label>
      <p class="choice-foot">Please be respectful. You can leave a conversation whenever you need.</p>
    </section>
  </main>
  <script>
    (() => {
      const key = "afterDarkAgeConfirmedV1";
      const age = document.getElementById("age-confirm");
      const links = [document.getElementById("text-choice"), document.getElementById("video-choice")];
      let confirmed = false;
      try { confirmed = localStorage.getItem(key) === "yes"; } catch (_) {}
      age.checked = confirmed;
      const sync = () => links.forEach(link => link.setAttribute("aria-disabled", String(!age.checked)));
      sync();
      age.addEventListener("change", () => {
        try { if (age.checked) localStorage.setItem(key, "yes"); else localStorage.removeItem(key); } catch (_) {}
        sync();
      });
      links.forEach(link => link.addEventListener("click", event => {
        if (!age.checked) { event.preventDefault(); age.focus(); }
      }));
    })();
  </script>
</body>
</html>
